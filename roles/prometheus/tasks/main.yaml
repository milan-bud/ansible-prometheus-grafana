---
- name: Check installed Prometheus version
  ansible.builtin.command: /usr/local/bin/prometheus --version
  register: prometheus_check
  failed_when: false
  changed_when: false

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download Prometheus
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: '0644'
  when: prometheus_version not in (prometheus_check.stdout | default(''))

- name: Extract Prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: "/tmp"
    remote_src: true
  when: prometheus_version not in (prometheus_check.stdout | default(''))

- name: Copy Prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: prometheus
    group: prometheus
    mode: '0755'
    remote_src: true
  loop:
    - prometheus
    - promtool
  when: prometheus_version not in (prometheus_check.stdout | default(''))
  notify: Restart prometheus

- name: Deploy Prometheus configuration file
  ansible.builtin.template:
    src: prometheus.yaml.j2
    dest: /etc/prometheus/prometheus.yaml
    owner: prometheus
    group: prometheus
    mode: '0644'
    validate: '/usr/local/bin/promtool check config %s'
  notify: Restart prometheus

- name: Create Prometheus systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Server
      After=network.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yaml \
        --storage.tsdb.path=/var/lib/prometheus/

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd
    - Restart prometheus

- name: Ensure Prometheus is running and enabled
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
