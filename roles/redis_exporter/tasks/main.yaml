---
- name: Download redis_exporter binary
  ansible.builtin.get_url:
    url: "https://github.com/oliver006/redis_exporter/releases/download/v1.87.0/redis_exporter-v1.87.0.linux-amd64.tar.gz"
    dest: /tmp/redis_exporter.tar.gz
    mode: '0644'

- name: Extract redis_exporter archive
  ansible.builtin.unarchive:
    src: /tmp/redis_exporter.tar.gz
    dest: /tmp/
    remote_src: true

- name: Move redis_exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/redis_exporter-v1.87.0.linux-amd64/redis_exporter
    dest: /usr/local/bin/redis_exporter
    mode: '0755'
    remote_src: true

- name: Create systemd service for redis_exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/redis_exporter.service
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Redis Exporter
      After=network.target

      [Service]
      User=nobody
      ExecStart=/usr/local/bin/redis_exporter -redis.addr redis://localhost:6379 -web.listen-address :9121
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: Restart redis_exporter

- name: Ensure redis_exporter is enabled and started
  ansible.builtin.systemd:
    name: redis_exporter
    enabled: true
    state: started
