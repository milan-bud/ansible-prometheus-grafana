---
- name: Check installed redis_exporter version
  ansible.builtin.command: /usr/local/bin/redis_exporter --version
  register: redis_exporter_check
  failed_when: false
  changed_when: false

- name: Download redis_exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/oliver006/redis_exporter/releases/download/v{{ redis_exporter_version }}/redis_exporter-v{{ redis_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/redis_exporter-v{{ redis_exporter_version }}.tar.gz"
    mode: '0644'
  when: redis_exporter_version not in (redis_exporter_check.stdout | default(''))

- name: Extract redis_exporter archive
  ansible.builtin.unarchive:
    src: "/tmp/redis_exporter-v{{ redis_exporter_version }}.tar.gz"
    dest: /tmp/
    remote_src: true
  when: redis_exporter_version not in (redis_exporter_check.stdout | default(''))

- name: Move redis_exporter binary to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/redis_exporter-v{{ redis_exporter_version }}.linux-amd64/redis_exporter"
    dest: /usr/local/bin/redis_exporter
    mode: '0755'
    remote_src: true
  when: redis_exporter_version not in (redis_exporter_check.stdout | default(''))
  notify: Restart redis_exporter

- name: Create systemd service for redis_exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/redis_exporter.service
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Redis Exporter
      After=network.target

      [Service]
      User=nobody
      ExecStart=/usr/local/bin/redis_exporter -redis.addr redis://localhost:6379 -web.listen-address :9121
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: Restart redis_exporter

- name: Ensure redis_exporter is enabled and started
  ansible.builtin.systemd:
    name: redis_exporter
    enabled: true
    state: started
